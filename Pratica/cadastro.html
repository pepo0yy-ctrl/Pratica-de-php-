<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
</head>
<body>
    <div>
        <h1>Formulário de Cadastro</h1>
        <p>Preencha os campos abaixo:</p>
        
        <form action="processaCadastro.php" method="POST">
            <div>
                <label for="nomeCompleto">Nome Completo:</label><br>
                <input type="text" id="nomeCompleto" name="nomeCompleto" required><br><br>
            </div>
            
            <div>
                <label for="idade">Idade:</label><br>
                <input type="number" id="idade" name="idade" min="0" required><br><br>
            </div>
            
            <div>
                <label for="profissao">Profissão:</label><br>
                <input type="text" id="profissao" name="profissao" required><br><br>
            </div>
            
            <div>
                <label for="salarioPretendido">Salário Pretendido:</label><br>
                <input type="text" id="salarioPretendido" name="salarioPretendido" placeholder="Ex: R$ 3.000,00" required><br><br>
            </div>
            
            <div>
                <label for="experienciaAnterior">Experiência Anterior:</label><br>
                <textarea id="experienciaAnterior" name="experienciaAnterior" rows="5" cols="40" required></textarea><br><br>
            </div>
            
            <div>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>
        </form>
    </div>
</body>
</html>
